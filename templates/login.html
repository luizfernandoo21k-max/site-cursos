<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Aprenda Online</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login {
            background: white;
            width: 90%;
            max-width: 400px;
            padding: 30px;
            border-radius: 12px;
            box-sizing: border-box;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <div class="login">

        <h1>Área do Aluno</h1>

        <p>Entre para acessar seus cursos.</p>

        <form method="POST" action="/login">

            <input type="email" name="email" placeholder="Seu e-mail" required>

            <input type="password" name="senha" placeholder="Sua senha" required>

            <button type="submit">Entrar</button>

        </form>

        <p>
            Ainda não tem uma conta?
            <a href="/cadastro">Criar conta</a>
        </p>

    </div>

</body>
</html>
