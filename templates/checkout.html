<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finalizar compra</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #222;
        }

        .checkout {
            width: 100%;
            max-width: 500px;
            margin: 40px auto;
            background: white;
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        h1 {
            text-align: center;
            margin-top: 0;
        }

        .curso {
            background: #f3f4f6;
            padding: 18px;
            border-radius: 12px;
            margin: 20px 0;
        }

        .curso h2 {
            margin-top: 0;
        }

        .preco {
            font-size: 30px;
            font-weight: bold;
            margin: 10px 0;
        }

        .descricao {
            color: #666;
            line-height: 1.6;
        }

        .botao {
            display: block;
            width: 100%;
            text-align: center;
            background: #111827;
            color: white;
            text-decoration: none;
            padding: 15px;
            border-radius: 10px;
            font-size: 17px;
            font-weight: bold;
            margin-top: 20px;
        }

        .seguranca {
            text-align: center;
            color: #777;
            font-size: 13px;
            margin-top: 18px;
        }
    </style>
</head>

<body>

    <div class="checkout">

        <h1>🛒 Finalizar compra</h1>

        <div class="curso">

            <h2>Curso de HTML e CSS</h2>

            <p class="descricao">
                Aprenda a criar seus primeiros sites usando
                HTML e CSS, começando do zero.
            </p>

            <p>Valor do curso:</p>

            <div class="preco">
                R$ 29,90
            </div>

        </div>

        <p>
            Confira os dados do curso antes de continuar.
        </p>

        <a class="botao" href="/login">
            Acessar curso
        </a>

        <p class="seguranca">
            🔒 Ambiente seguro
        </p>

    </div>

</body>
</html>
